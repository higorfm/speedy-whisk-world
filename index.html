<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speedy Whisk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F4F48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Speedy Whisk World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: one-screen kitchen app. Deep-teal top bar, cream counter below; one station in focus at a time. Single bright game look by choice. */
:root{
  --ocean:#3BB3C3; --teal:#1E7F74; --deep:#0F4F48; --sun:#FFC93C; --coral:#FF5A5F; --leaf:#2BA84A;
  --cream:#FFF6E9; --paper:#FFFFFF; --ink:#16302C; --muted:#4E6763; --line:#E7DCC8; --bad:#D62839;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Fredoka','Nunito',system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.bar{background:var(--deep);color:#fff;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:60px;flex-wrap:wrap}
.bar .brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:0}
.bar .brand svg{width:38px;height:38px}
.bar .spacer{flex:1}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px}
.timer{background:var(--sun);color:var(--ink);font-family:var(--display);font-size:24px;border-radius:12px;padding:4px 14px;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{background:var(--coral);color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.skip{background:transparent;border:1.5px dashed rgba(255,255,255,.5);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
.stage{flex:1;overflow:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
h1{font-size:clamp(30px,5vw,46px);color:var(--deep)}
h2{font-size:clamp(24px,3.6vw,32px);color:var(--deep)}
h3{font-size:20px;color:var(--deep)}
p{margin:0}
.sub{color:var(--muted);font-size:18px}
.btn{background:var(--coral);color:#fff;border:0;border-radius:16px;padding:14px 26px;font-size:20px;font-weight:700;box-shadow:0 5px 0 #B8323A;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #B8323A}
.btn.alt{background:var(--teal);box-shadow:0 5px 0 var(--deep)}
.btn.ghost{background:var(--paper);color:var(--deep);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border-radius:22px;padding:20px;border:2px solid var(--line)}

.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.logo-btn{background:none;border:0;padding:0;border-radius:50%;animation:bob 2.4s ease-in-out infinite}
.logo-btn svg{width:min(78vw,420px);height:auto;display:block}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.tap{font-family:var(--display);font-size:24px;color:var(--teal)}

.dress{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:20px;align-items:start}
.preview{background:linear-gradient(var(--ocean),#7FD3DC);border-radius:26px;display:flex;flex-direction:column;align-items:center;padding:20px 12px;gap:8px;position:sticky;top:0}
.preview svg{width:100%;max-width:220px;height:auto}
.preview .nm{font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 0 var(--deep)}
.opts{display:flex;flex-direction:column;gap:16px;min-width:0}
.opt h3{margin-bottom:8px;font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;min-height:44px}
.pill.on{border-color:var(--teal);background:#DDF4F1;color:var(--deep)}
.pill .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
.pill.new::after{content:"NEW";background:var(--sun);color:var(--ink);font-size:11px;border-radius:6px;padding:1px 5px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--teal)}
input[type=text]{font:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);width:100%;max-width:340px;background:var(--paper);color:var(--ink)}
@media (max-width:640px){.dress{grid-template-columns:1fr}.preview{position:static}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:18px;font-weight:600;position:relative;min-height:150px;justify-content:center;text-align:center}
.tile .big{font-size:52px;line-height:1}
.tile.play{border-color:var(--teal);box-shadow:0 6px 0 var(--teal)}
.tile.play:hover{transform:translateY(-2px)}
.tile.lock{opacity:.6;cursor:not-allowed;border-style:dashed}
.tile.lock .big{filter:grayscale(1)}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;border-radius:8px;padding:3px 8px;background:var(--line);color:var(--muted)}
.tag.easy{background:#D7F5DD;color:#1C6B2E}.tag.medium{background:#FFF0C2;color:#7A5A00}.tag.hard{background:#FFD9DB;color:#9B1C26}
.tag.extra{background:#E8DDFB;color:#5A2FA0}
.stars-mini{color:#B07D00;font-size:15px;letter-spacing:1px}
.prog-txt{font-size:14px;color:var(--muted);font-weight:500}

.phase{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.phase{grid-template-columns:1fr}}
.recipe{background:#FFFDF6;border:2px solid var(--line);border-radius:6px 22px 22px 6px;padding:18px 18px 18px 26px;position:relative;box-shadow:4px 4px 0 var(--line)}
.recipe::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;border-left:2px dotted #F2A7AA}
.recipe h3{font-size:22px;margin-bottom:2px}
.recipe .small{font-size:14px;color:var(--muted);margin-bottom:10px;text-transform:capitalize}
.recipe ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.recipe li{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;font-weight:500}
.recipe li .amt{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.recipe li.done{background:#DCF5E1;color:#1C6B2E}
.recipe li.done .ck{background:var(--leaf);border-color:var(--leaf);color:#fff}
.recipe li.now{background:#FFF0C2}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.kitchen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.kitchen{grid-template-columns:1fr}}
.box{border-radius:22px;min-height:300px;display:flex;flex-direction:column;overflow:hidden;border:4px solid}
.box .lbl{font-family:var(--display);font-size:20px;padding:8px 14px;color:#fff}
.cold{border-color:#8FB8D6;background:#EAF5FC}.cold .lbl{background:#5F92B8}
.wood{border-color:#B98754;background:#FBEBD6}.wood .lbl{background:#8F6136}
.door{flex:1;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;color:var(--ink)}
.cold .door{background:linear-gradient(90deg,#DCEEF9,#C7E2F4)}
.wood .door{background:repeating-linear-gradient(90deg,#D9A66E 0 48%,#9A6A3C 48% 52%,#D9A66E 52% 100%)}
.door .handle{width:12px;height:70px;border-radius:6px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.shelf{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;padding:14px;align-content:start}
.item{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink);min-height:86px;justify-content:center;text-align:center}
.item .e{font-size:36px;line-height:1.1}
.item.got{background:#DCF5E1;border-color:var(--leaf);color:#1C6B2E;transform:scale(.92)}
.item.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.station{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-height:420px}
.hint{color:var(--muted);font-size:18px;max-width:46ch}
.meter{position:relative;width:100%;max-width:460px;height:34px;border-radius:17px;background:#EEE6D6;overflow:hidden;border:3px solid var(--deep)}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(43,168,74,.35);border-left:3px solid var(--leaf);border-right:3px solid var(--leaf)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));opacity:.85}
.meter.cool .fill{background:linear-gradient(90deg,#BFE6F5,#5F92B8)}
.scene{font-size:110px;line-height:1;position:relative;user-select:none}
.flame{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);width:120px;height:26px;border-radius:50%;background:radial-gradient(var(--sun),var(--coral) 60%,transparent 70%);opacity:0;transition:opacity .2s}
.flame.on{opacity:1;animation:flick .2s infinite alternate}
@keyframes flick{to{transform:translateX(-50%) scaleY(1.25)}}
.pad{width:min(320px,80vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(#FFF4D6 0 55%,#F1D9A6 56% 62%,#E7DCC8 63%);position:relative;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;border:3px dashed var(--line)}
.pad .center{font-size:70px;pointer-events:none}
.pad .tool{position:absolute;font-size:48px;pointer-events:none;transform:translate(-50%,-50%);left:50%;top:20%}
.prog{width:100%;max-width:460px;height:18px;border-radius:9px;background:#EEE6D6;overflow:hidden}
.prog>div{height:100%;width:0;background:var(--leaf);transition:width .15s}
.eggs,.adds{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.egg,.add{font-size:80px;background:none;border:0;padding:0;line-height:1;transition:transform .2s,opacity .3s}
.add{font-size:64px;background:#FFF4D6;border-radius:22px;padding:10px;border:2px solid var(--line)}
.egg.cracked{transform:rotate(-18deg)}
.egg.gone,.add.gone{opacity:0;transform:translateY(60px) scale(.4);pointer-events:none}
.grate{width:min(440px,100%);height:200px;border-radius:20px;background:repeating-linear-gradient(90deg,#F4E9D3 0 22px,#E9DABB 22px 26px);position:relative;touch-action:none;user-select:none;overflow:hidden;border:3px solid var(--deep)}
.grate .cheese{position:absolute;top:50%;left:50%;font-size:80px;transform:translate(-50%,-50%);pointer-events:none}
.pile{font-size:26px;min-height:36px;color:var(--muted);letter-spacing:2px}
.dough{width:200px;height:150px;border-radius:50%;background:#FFF4D6;border:3px solid #E2C27A;transition:transform .1s;font-size:80px;line-height:1}
.dough.squish{transform:scale(1.15,.82)}
.tray{display:grid;gap:12px;padding:18px;background:#8C9AA0;border-radius:16px;border:4px solid #5D6B70}
.slot{width:64px;height:64px;border-radius:50%;border:3px dashed #D5DDE0;background:transparent;font-size:40px;line-height:1;padding:0}
.slot.full{border:0;background:rgba(255,255,255,.25)}
.oven{width:min(420px,100%);border-radius:24px;background:#3A3F44;padding:18px;border:4px solid #23272B}
.oven.stove{background:#5D6B70;border-color:#3A3F44}
.oven.fridge{background:#DCEEF9;border-color:#8FB8D6}
.oven .win{background:#1B1E21;border-radius:14px;padding:18px;box-shadow:inset 0 0 30px rgba(255,140,0,.45);font-size:100px;line-height:1.1}
.oven.fridge .win{background:#F4FBFF;box-shadow:inset 0 0 30px rgba(95,146,184,.4)}
.oven .knobs{display:flex;gap:10px;justify-content:center;margin-top:12px}
.oven .knobs i{width:18px;height:18px;border-radius:50%;background:#9AA3A8;display:block}

.result{text-align:center;align-items:center}
.stars{font-size:clamp(46px,9vw,72px);letter-spacing:6px;color:#D9CFBC}
.stars .on{color:var(--sun);text-shadow:0 3px 0 #C98F00;display:inline-block;animation:pop .4s backwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.customers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
@media (max-width:560px){.customers{grid-template-columns:1fr}}
.cust{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cust .face{font-size:46px}
.cust q{font-style:italic;color:var(--muted)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
.score div{background:#FFFDF6;border:2px solid var(--line);border-radius:14px;padding:10px}
.score b{display:block;font-family:var(--display);font-size:26px;color:var(--deep);font-weight:400;font-variant-numeric:tabular-nums}
.score span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.reward{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#FFF0C2,#FFE08A);border-radius:22px;padding:16px 20px;border:3px solid var(--sun);text-align:left;flex-wrap:wrap;justify-content:center}
.reward svg{width:110px;height:auto}

.overlay{position:fixed;inset:0;background:rgba(15,79,72,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--paper);border-radius:28px;padding:28px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.modal .big{font-size:70px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--deep);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;font-size:18px;transition:transform .25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <header class="bar" id="bar">
    <button class="brand" id="home" aria-label="Go to start screen"><svg viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="186" fill="#fff"/><circle cx="200" cy="200" r="175" fill="#3BB3C3"/><path d="M60 120C90 90 140 100 150 130C158 155 130 165 120 190C110 215 80 220 65 200C50 180 40 140 60 120Z" fill="#7AC74F"/><path d="M300 200C330 190 365 210 360 245C355 275 325 285 310 265C300 250 285 215 300 200Z" fill="#7AC74F"/><circle cx="200" cy="165" r="70" fill="#fff" stroke="#0F4F48" stroke-width="10"/><path d="M20 248H380L362 274L380 300H20L38 274Z" fill="#FF5A5F"/></svg>Speedy Whisk World</button>
    <span class="spacer"></span>
    <span class="chip" id="who" hidden></span>
    <button class="skip" id="skip" hidden>Skip (test)</button>
    <span class="timer" id="timer" hidden>0:30</span>
  </header>
  <main class="stage" id="stage"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data">
/* ---------- ingredients (f = fridge, p = pantry) and tools (d = drawer, s = shelf) ---------- */
function lib(s){const o={};s.trim().split(/\s*,\s*/).forEach(x=>{const[k,n,e,p]=x.split(':');o[k]={n,e,p}});return o}
const ITEMS=lib(`milk:Milk:🥛:f,eggs:Eggs:🥚:f,cheese:Cheese:🧀:f,mozz:Mozzarella:🧀:f,parm:Parmesan:🧀:f,mascarpone:Mascarpone:🍦:f,butter:Butter:🧈:f,cream:Cream:🍶:f,sourcream:Sour cream:🍶:f,

basil:Basil:🌿:f,cilantro:Cilantro:🌿:f,lemongrass:Lemongrass:🌿:f,greenonion:Green onion:🌿:f,mushroom:Mushrooms:🍄:f,mango:Mango:🥭:f,strawberry:Strawberries:🍓:f,apple:Apples:🍎:f,
acai:Açaí:🫐:f,dough:Pastry dough:🥐:f,icewater:Ice water:🧊:f,
flour:Flour:🌾:p,tapioca:Tapioca flour:🌾:p,riceflour:Rice flour:🌾:p,almond:Almond flour:🌰:p,masa:Masa flour:🌽:p,sugar:Sugar:🍬:p,powdered:Powdered sugar:🍚:p,salt:Salt:🧂:p,
oil:Oil:🫙:p,olive:Olive oil:🫒:p,rice:Rice:🍚:p,stickyrice:Sticky rice:🍚:p,beans:Black beans:🫘:p,redbean:Red bean paste:🫘:p,pasta:Spaghetti:🍝:p,macaroni:Macaroni:🍝:p,
lasagna:Lasagna sheets:🍝:p,noodles:Rice noodles:🍜:p,ramen:Ramen noodles:🍜:p,choc:Chocolate:🍫:p,cocoa:Cocoa powder:🍫:p,condensed:Condensed milk:🥫:p,sprinkles:Sprinkles:✨:p,
bread:Bread:🍞:p,buns:Buns:🍞:p,crumbs:Breadcrumbs:🍞:p,yeast:Yeast:🫧:p,bpowder:Baking powder:🧂:p,tsauce:Tomato sauce:🥫:p,redsauce:Red chili sauce:🥫:p,salsa:Salsa:🥫:p,
bbq:BBQ sauce:🥫:p,curry:Curry paste:🥫:p,roux:Curry cubes:🟫:p,coconut:Coconut milk:🥥:p,fishsauce:Fish sauce:🫗:p,soy:Soy sauce:🫗:p,vinegar:Rice vinegar:🫗:p,broth:Broth:🥫:p,
peanuts:Peanuts:🥜:p,nori:Seaweed:🟩:p,ricepaper:Rice paper:📄:p,tortilla:Tortillas:🫓:p,wrappers:Gyoza wrappers:🫓:p,chips:Tortilla chips:🔺:p,husks:Corn husks:🌽:p,

function screenAvatar(){
  hideTimer();updateWho();const p=S.player;
  const pill=(on,label,attrs,dot,isNew)=>`<button class="pill${on?' on':''}${isNew?' new':''}" ${attrs}>${dot?`<span class="dot" style="background:${dot}"></span>`:''}${label}</button>`;
  const isNew=k=>S.fresh.includes(k);
  render(`<div class="wrap"><div><h1>Make your chef</h1><p class="sub">Pick your look. You win more clothes every time you master a dish.</p></div>
  <div class="dress"><div class="preview">${avatarSVG(p)}<div class="nm">${p.name?esc(p.name):'Your chef'}</div></div>
  <div class="opts">
   <div class="opt"><h3><label for="nm">Name</label></h3><input type="text" id="nm" maxlength="14" placeholder="Type your name" value="${esc(p.name)}"></div>
   <div class="opt"><h3>Girl or boy</h3><div class="pills">${pill(p.gender==='girl','Girl','data-g="girl"')}${pill(p.gender==='boy','Boy','data-g="boy"')}</div></div>
   <div class="opt"><h3>Skin</h3><div class="pills">${SKINS.map((c,i)=>`<button class="sw${p.skin===i?' on':''}" style="background:${c}" data-skin="${i}" aria-label="Skin tone ${i+1}"></button>`).join('')}</div></div>
   <div class="opt"><h3>Hair</h3><div class="pills">${S.owned.hair.map(h=>pill(p.hair===h,HAIR_NAMES[h],`data-hair="${h}"`,null,isNew(h))).join('')}</div>
     <div class="pills" style="margin-top:10px">${HAIR_COLORS.map(c=>`<button class="sw${p.hairColor===c?' on':''}" style="background:${c}" data-hc="${c}" aria-label="Hair color"></button>`).join('')}</div></div>
   <div class="opt"><h3>Clothes</h3><div class="pills">${S.owned.tops.map(t=>pill(!p.outfit&&p.top===t,TOPS[t].name,`data-top="${t}"`,TOPS[t].color,isNew(t))).join('')}${S.owned.outfits.map(o=>pill(p.outfit===o,OUTFITS[o].name,`data-outfit="${o}"`,OUTFITS[o].top,isNew(o))).join('')}</div></div>
   <div class="opt"><h3>Shoes</h3><div class="pills">${S.owned.shoes.map(s=>pill(p.shoes===s,SHOES[s].name,`data-shoes="${s}"`,SHOES[s].color,isNew(s))).join('')}</div></div>
   <div class="opt"><h3>Apron</h3><div class="pills">${pill(!p.apron,'No apron','data-apron=""')}${S.owned.aprons.map(a=>pill(p.apron===a,APRONS[a].name,`data-apron="${a}"`,APRONS[a].color,isNew(a))).join('')}${S.owned.aprons.length?'':'<span class="sub" style="font-size:15px;align-self:center">Every dish you master wins an apron!</span>'}</div></div>
   <div class="row"><button class="btn" id="next">Let's cook!</button></div>
  </div></div></div>`);
  const nm=$('#nm');nm.oninput=()=>{p.name=nm.value.trim();save();$('.preview .nm').textContent=p.name||'Your chef';updateWho()};
  stage.querySelectorAll('[data-g],[data-skin],[data-hair],[data-hc],[data-top],[data-outfit],[data-shoes],[data-apron]').forEach(b=>b.onclick=()=>{
    const d=b.dataset;
    if(d.g){p.gender=d.g;p.hair=d.g==='boy'?'short':'long'}
    if(d.skin)p.skin=+d.skin; if(d.hair)p.hair=d.hair; if(d.hc)p.hairColor=d.hc;
    if(d.top){p.top=d.top;p.outfit=null} if(d.outfit)p.outfit=d.outfit; if(d.shoes)p.shoes=d.shoes; if('apron' in d)p.apron=d.apron||null;
    save();const y=stage.scrollTop;screenAvatar();stage.scrollTop=y});
  $('#next').onclick=()=>{if(!p.name){toast('Type your name first!',true);nm.focus();return}S.fresh=[];save();screenCountry()};
}

function screenCountry(){
  hideTimer();updateWho();
  render(`<div class="wrap"><div><h1>Where do you want to cook?</h1><p class="sub">Pick a country.</p></div>
  <div class="grid">${COUNTRIES.map(c=>{const all=[...c.base,...c.extras],m=all.filter(r=>S.best[r.id]).length;
    return `<button class="tile play" data-c="${c.id}"><span class="big">${c.icon}</span>${c.name}<span class="prog-txt">${m} of ${all.length} mastered</span></button>`}).join('')}</div>
  <div class="row"><button class="btn ghost" id="back">Change my chef</button></div></div>`);
  stage.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>screenDish(b.dataset.c));$('#back').onclick=screenAvatar;
}

function screenDish(cid){
  hideTimer();const c=country(cid);
  const tile=(r,open)=>open?`<button class="tile play" data-r="${r.id}"><span class="big">${r.icon}</span>${r.name}<span class="tag ${r.extra?'extra':r.lvl}">${r.extra?'Extra · hard':r.lvl} · ${fmt(COOK_TIME[r.lvl])}</span>${S.best[r.id]?`<span class="stars-mini" aria-label="Best ${S.best[r.id]} stars">${stars(S.best[r.id])}</span>`:''}</button>`
    :`<button class="tile lock" disabled><span class="big">${r.icon}</span>🔒 ${r.name}<span class="tag extra">Extra · locked</span></button>`;
  const open=c.extras.filter(r=>S.unl.includes(r.id)).length;
  render(`<div class="wrap"><div><h1>${c.icon} ${c.name}</h1><p class="sub">Pick a dish. Easy has 2 minutes to cook, medium has 3, hard has 4.</p></div>
  <div class="grid">${c.base.map(r=>tile(r,true)).join('')}</div>
  <div><h2>Extra recipes</h2><p class="sub" style="margin-top:4px">${open} of ${c.extras.length} unlocked. Master easy to win 1 extra, medium to win 2, hard to win 3.</p></div>
  <div class="grid">${c.extras.map(r=>tile(r,S.unl.includes(r.id))).join('')}</div>
  <div class="row"><button class="btn ghost" id="back">Other countries</button></div></div>`);
  stage.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>startDish(b.dataset.r));$('#back').onclick=screenCountry;
}
function startDish(id){run={r:RECIPES[id],mistakes:0,left:0,q:[]};screenGather('ing')}
function recipeCard(r,listHtml,sub){return `<div class="recipe"><h3>${r.icon} ${r.name}</h3><p class="small">${sub}</p><ul id="list">${listHtml}</ul></div>`}

/* gather phase: ingredients or tools */
function screenGather(kind){
  const r=run.r,isIng=kind==='ing',L=isIng?ITEMS:TOOLS,got=new Set();
  const need=isIng?r.ing:r.tools.map(k=>[k,'']);
  const keys=need.map(n=>n[0]);
  const boxes=(isIng?['f','p']:['d','s']).map(pl=>{
    const mine=keys.filter(k=>L[k].p===pl);
    const others=shuffle(Object.keys(L).filter(k=>L[k].p===pl&&!keys.includes(k)&&!mine.some(m=>L[m].e===L[k].e&&L[m].n===L[k].n)));
    return{pl,items:shuffle([...mine,...others.slice(0,Math.max(3,8-mine.length))])}});
  const boxHtml=b=>`<div class="box ${BOX[b.pl][1]}"><div class="lbl">${BOX[b.pl][0]}</div><button class="door" data-open="${b.pl}"><span class="handle"></span>Tap to open</button><div class="shelf" id="sh-${b.pl}" hidden>${b.items.map(k=>`<button class="item" data-k="${k}"><span class="e">${L[k].e}</span>${L[k].n}</button>`).join('')}</div></div>`;
  const list=need.map(([k,a])=>`<li data-n="${k}"><span class="ck" aria-hidden="true">✓</span>${L[k].n}<span class="amt">${a}</span></li>`).join('');
  render(`<div class="wrap"><div><h2>${isIng?'Grab the ingredients!':'Grab the pots and tools!'}</h2><p class="sub">Read the recipe and tap only what you need. You have 30 seconds.</p></div>
  <div class="phase">${recipeCard(r,list,isIng?`${country(r.c).name} · ${r.extra?'extra':r.lvl}`:'Tools you need')}<div class="kitchen">${boxes.map(boxHtml).join('')}</div></div></div>`);
  stage.querySelectorAll('[data-open]').forEach(d=>d.onclick=()=>{d.hidden=true;$('#sh-'+d.dataset.open).hidden=false});
  const done=()=>{stopTimer();setSkip(null);toast(isIng?'All ingredients! 🎉':'All tools ready! 🎉');later(()=>isIng?screenGather('tools'):screenCook(),900)};
  stage.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(got.has(k))return;
    if(keys.includes(k)){got.add(k);b.classList.add('got');stage.querySelector(`[data-n="${k}"]`).classList.add('done');if(got.size===keys.length)done()}
    else{run.mistakes++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast(`${L[k].n} is not in the recipe!`,true)}});
  startTimer(30,()=>overlay('⏰',"Time's up!",isIng?"You didn't get all the ingredients. Try again!":"You didn't get all the tools. Try again!",[{label:'Try again',fn:()=>screenGather(kind)},{label:'Menu',cls:'ghost',fn:()=>screenDish(r.c)}]));
  setSkip(()=>{keys.forEach(k=>{got.add(k);stage.querySelector(`[data-k="${k}"]`).classList.add('got');stage.querySelector(`[data-n="${k}"]`).classList.add('done')});stage.querySelectorAll('.shelf').forEach(s=>s.hidden=false);stage.querySelectorAll('.door').forEach(s=>s.hidden=true);done()});
}

/* cooking */
function screenCook(){
  const r=run.r,total=COOK_TIME[r.lvl];run.step=0;run.q=[];run.left=total;run.total=total;
  render(`<div class="wrap"><div><h2>Cook the ${r.name}!</h2><p class="sub">${r.extra?'Extra':r.lvl[0].toUpperCase()+r.lvl.slice(1)} dish: ${total/60} minutes. Follow the steps.</p></div>
  <div class="phase">${recipeCard(r,r.steps.map(s=>`<li><span class="ck" aria-hidden="true">✓</span>${s.t}</li>`).join(''),'Turn each step green')}
  <section class="station" id="station" aria-live="polite"></section></div></div>`);
  startTimer(total,()=>{stopAnim();overlay('⏰',"Time's up!",'The customers are getting hungry. Try cooking again!',[{label:'Try again',fn:screenCook},{label:'Menu',cls:'ghost',fn:()=>screenDish(r.c)}])});
  setSkip(()=>{const s=r.steps[run.step];if(s&&(s.k==='heat'||s.k==='bake'))run.q.push(1);nextStep('Skipped')});
  doStep();
}
function doStep(){
  stage.querySelectorAll('#list li').forEach((li,i)=>{li.classList.toggle('done',i<run.step);li.classList.toggle('now',i===run.step)});
  const s=run.r.steps[run.step];if(!s){finishCook();return}
  const el=$('#station');el.innerHTML='';UI[s.k](el,s);
}
function nextStep(msg){stopAnim();toast(msg||'Nice!');run.step++;
  stage.querySelectorAll('#list li').forEach((li,i)=>li.classList.toggle('done',i<run.step));later(doStep,600)}
function prog(f){const p=$('#pg');if(p)p.style.width=Math.min(100,f*100)+'%'}
const GOOD=['Nice!','Great job!','Yummy!','Super!','Awesome!'];
const good=()=>GOOD[Math.floor(Math.random()*GOOD.length)];

const BAKE={oven:{hint:'Put on your oven mitts and take it out when the bar is in the green zone.',btn:'🧤 Take it out',cls:'',fail:'Oh no, it burned!'},
  stove:{hint:'Take it off the heat when the bar is in the green zone.',btn:'Take it off the heat',cls:'stove',fail:'Oh no, it burned!'},
  fryer:{hint:'Take it out of the oil when the bar is in the green zone.',btn:'Take it out of the oil',cls:'stove',fail:'Too crispy! It burned.'},
  fridge:{hint:'Take it out of the fridge when the bar is in the green zone.',btn:'Take it out of the fridge',cls:'fridge',fail:'Oops, it got too cold!'},
  torch:{hint:'Stop the torch when the bar is in the green zone.',btn:'Stop the torch',cls:'stove',fail:'Oh no, it burned!'}};

const UI={
heat(el,s){
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">Turn on the stove. Turn it off when the bar reaches the green zone. Don't let it boil over!</p>
  <div class="scene" style="margin-bottom:26px">${s.e}<div class="flame" id="fl"></div></div>
  <div class="meter"><div class="zone" style="left:70%;width:20%"></div><div class="fill" id="mf"></div></div>
  <button class="btn" id="bn">Turn on the stove</button>`;
  let v=0,on=false;const bn=$('#bn'),mf=$('#mf'),fl=$('#fl');
  bn.onclick=()=>{
    if(!on){on=true;bn.textContent='Turn it off';fl.classList.add('on');
      loop(dt=>{v+=dt*0.022;mf.style.width=Math.min(v,100)+'%';if(v>=100){on=false;fl.classList.remove('on');run.q.push(0);toast('Too hot! It boiled over.',true);bn.disabled=true;later(()=>nextStep('Keep going'),700);return false}})}
    else{on=false;stopAnim();fl.classList.remove('on');bn.textContent='Turn on the stove';
      if(v<55){toast('Still too cold. Heat it more!',true);return}
      const ok=v>=70&&v<=90;run.q.push(ok?1:.5);bn.disabled=true;nextStep(ok?'Perfect heat!':'Pretty good!')}};
},
stir(el,s){
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">Draw circles with your finger.</p><div class="pad" id="pad"><span class="center">${s.e}</span><span class="tool" id="tl">${s.tool}</span></div><div class="prog"><div id="pg"></div></div>`;
  const pad=$('#pad'),tl=$('#tl'),goal=s.n*2*Math.PI;let down=false,prev=0,total=0,fin=false;
  const ang=e=>{const r=pad.getBoundingClientRect();tl.style.left=(e.clientX-r.left)+'px';tl.style.top=(e.clientY-r.top)+'px';return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)};
  pad.onpointerdown=e=>{down=true;pad.setPointerCapture(e.pointerId);prev=ang(e)};
  pad.onpointerup=pad.onpointercancel=()=>down=false;
  pad.onpointermove=e=>{if(!down||fin)return;const a=ang(e);let d=a-prev;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;total+=Math.abs(d);prev=a;prog(total/goal);if(total>=goal){fin=true;nextStep(good())}};
},
crack(el,s){
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">Tap each egg twice: once to crack it, once to drop it in.</p><div class="eggs">${'<button class="egg" aria-label="Egg">🥚</button>'.repeat(s.n)}</div><div class="scene">🥣</div>`;
  let n=0;el.querySelectorAll('.egg').forEach(b=>{let t=0;b.onclick=()=>{t++;if(t===1){b.classList.add('cracked');toast('Crack!')}else if(t===2){b.classList.add('gone');n++;if(n===s.n)nextStep('Eggs in!')}}});
},
add(el,s){
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">Tap each one to add it.</p><div class="adds">${s.items.map(i=>`<button class="add" aria-label="Add">${i}</button>`).join('')}</div><div class="scene">${s.e||'🥣'}</div>`;
  let n=0;el.querySelectorAll('.add').forEach(b=>b.onclick=()=>{b.classList.add('gone');n++;if(n===s.items.length)nextStep(good())});
},
swipe(el,s){
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">Swipe left and right with your finger.</p><div class="grate" id="gr"><div class="cheese" id="ch">${s.e}</div></div><div class="pile" id="pile" aria-hidden="true"></div><div class="prog"><div id="pg"></div></div>`;
  const gr=$('#gr'),ch=$('#ch');let down=false,lastX=0,turnX=0,dir=0,strokes=0,x0=0,fin=false;
  gr.onpointerdown=e=>{down=true;gr.setPointerCapture(e.pointerId);lastX=turnX=e.clientX;dir=0;x0=gr.getBoundingClientRect().left};
  gr.onpointerup=gr.onpointercancel=()=>down=false;
  gr.onpointermove=e=>{if(!down||fin)return;const x=e.clientX,d=x-lastX;ch.style.left=(x-x0)+'px';if(Math.abs(d)<2)return;const nd=Math.sign(d);
    if(dir&&nd!==dir){if(Math.abs(lastX-turnX)>=40){strokes++;prog(strokes/s.n);$('#pile').textContent='▪'.repeat(strokes*2);if(strokes>=s.n){fin=true;nextStep(good())}}turnX=lastX}
    dir=nd;lastX=x};
},
tap(el,s){
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">Tap it ${s.n} times.</p><button class="dough" id="dg" aria-label="Tap">${s.e}</button><div class="prog"><div id="pg"></div></div>`;
  let n=0;const dg=$('#dg');dg.onclick=()=>{n++;dg.classList.add('squish');setTimeout(()=>dg.classList.remove('squish'),100);prog(n/s.n);if(n===s.n){dg.disabled=true;nextStep(good())}};
},
place(el,s){
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">Tap every spot.</p><div class="tray" style="grid-template-columns:repeat(${Math.min(s.n,4)},64px)">${'<button class="slot" aria-label="Empty spot"></button>'.repeat(s.n)}</div>`;
  let n=0;el.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{if(b.classList.contains('full'))return;b.classList.add('full');b.textContent=s.e;b.setAttribute('aria-label','Done');n++;if(n===s.n)nextStep(good())});
},
bake(el,s){
  const m=BAKE[s.m],cold=s.m==='fridge';
  el.innerHTML=`<h2>${s.t}</h2><p class="hint">${m.hint}</p>
  <div class="oven ${m.cls}"><div class="win" id="win">${s.e}</div><div class="knobs"><i></i><i></i><i></i></div></div>
  <div class="meter${cold?' cool':''}"><div class="zone" style="left:62%;width:20%"></div><div class="fill" id="mf"></div></div>
  <button class="btn" id="out">${m.btn}</button>`;
  let v=0;const mf=$('#mf'),win=$('#win'),out=$('#out');
  loop(dt=>{v+=dt*0.011;const f=Math.min(v,100);mf.style.width=f+'%';
    win.style.filter=cold?`saturate(${1-f/150}) brightness(${1+f/300})`:`sepia(${f/140}) brightness(${1.1-Math.max(0,f-60)*0.013})`;
    if(v>=100){run.q.push(0);out.disabled=true;toast(m.fail,true);later(()=>nextStep('Keep going'),800);return false}});
  out.onclick=()=>{if(v<45){toast('Not ready yet! Wait a little.',true);return}stopAnim();out.disabled=true;const ok=v>=62&&v<=82;run.q.push(ok?1:.5);nextStep(ok?'Perfect!':'Pretty good!')};
}};

/* results */
function finishCook(){
  stopTimer();setSkip(null);hideTimer();
  const r=run.r,taste=Math.round(60*(run.q.length?run.q.reduce((a,b)=>a+b,0)/run.q.length:1));
  const care=Math.max(0,20-5*run.mistakes),speed=Math.round(20*Math.min(1,run.left/(run.total/2)));
  const total=taste+care+speed,st=total>=85?5:total>=70?4:total>=50?3:total>=30?2:1;
  S.best[r.id]=Math.max(S.best[r.id]||0,st);
  const pool=REWARD_POOLS[st];S.fresh=[];
  const won=[grant(pool.kind)];
  if(pool.kind==='outfits')won.push(grant('shoes'));
  if(pool.kind!=='aprons')won.push(grant('aprons'));
  const wonNames=won.filter(Boolean);
  const c=country(r.c),newRec=c.extras.filter(x=>!S.unl.includes(x.id)).slice(0,UNLOCK_COUNT[r.lvl]);
  S.unl.push(...newRec.map(x=>x.id));save();
  const nm=r.name;
  const Q={5:[`Best ${nm} in the world!`,'Perfect, chef!','I want more!'],4:['So yummy!','Really, really good!','Almost perfect!'],3:['Pretty tasty!','Nice job, chef!','I liked it!'],2:['A little off, but I liked it.','Needs more practice.','Not bad!'],1:['Hmm… keep practicing!','A bit burnt…','Try again, chef!']}[st];
  const custs=[['👧','Lia'],['👴','Mr. Bento'],['👩','Ana']];
  render(`<div class="wrap result"><h1>You have mastered ${r.name}!</h1>
  <div class="stars" aria-label="${st} out of 5 stars">${[1,2,3,4,5].map(i=>i<=st?`<span class="on" style="animation-delay:${i*.18}s">★</span>`:'★').join('')}</div>
  <div class="score"><div><b>${speed}/20</b><span>Speed</span></div><div><b>${care}/20</b><span>Careful picks</span></div><div><b>${taste}/60</b><span>Taste</span></div></div>
  <div class="customers">${custs.map((x,i)=>`<div class="cust"><span class="face">${x[0]}</span><b>${x[1]}</b><q>${Q[i]}</q></div>`).join('')}</div>
  <div class="reward">${avatarSVG(S.player)}<div><h3>${st} star${st>1?'s':''}: you won ${pool.label}!</h3>
  <p class="sub">${wonNames.length?`<b>${wonNames.join(', ')}</b> ${wonNames.length>1?'are':'is'} in your closet, and your chef is wearing ${wonNames.length>1?'them':'it'}.`:'You already have everything from this prize!'}</p>
  ${newRec.length?`<p class="sub" style="margin-top:6px">New extra recipe${newRec.length>1?'s':''}: <b>${newRec.map(x=>x.icon+' '+x.name).join(', ')}</b></p>`:''}</div></div>
  <div class="row" style="justify-content:center"><button class="btn" id="again">Cook again</button><button class="btn alt" id="dress">Dress up</button><button class="btn ghost" id="menu">${c.name} menu</button></div></div>`);
  $('#again').onclick=()=>startDish(r.id);$('#dress').onclick=screenAvatar;$('#menu').onclick=()=>screenDish(r.c);
}

screenSplash();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
